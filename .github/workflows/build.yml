name: build

# This repository is a READ-ONLY MIRROR of the primary repo on a private forge (Gitea). Never push here directly: the mirror force-syncs
# and would discard anything that exists only on GitHub. Tests gate merges on the primary; GitHub's only job is to build and publish the
# image to GHCR when the mirror delivers a push to main. This workflow has no contents:write and never commits, pushes or tags.

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry-backed cache needs the buildx driver — the default `docker`
      # driver silently ignores cache-from/cache-to.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ghcr.io/kmbrimble/claude-code-unraid:latest
          # Registry-backed layer cache on a sibling `buildcache` tag of the
          # same GHCR package, rather than the GitHub Actions cache backend
          # (10GB per-repo cap, evicts entries unused for 7 days — an awkward
          # fit for an image this size that rebuilds irregularly). mode=max
          # caches intermediate build stages too, not just the final layer.
          cache-from: type=registry,ref=ghcr.io/kmbrimble/claude-code-unraid:buildcache
          cache-to: type=registry,ref=ghcr.io/kmbrimble/claude-code-unraid:buildcache,mode=max
          # buildx enables provenance attestation by default, which the old
          # docker driver couldn't produce — that would change the pushed
          # artifact from a bare manifest to an OCI image index. Disabled to
          # keep this change purely about cache/layer ordering, not artifact
          # shape.
          provenance: false
